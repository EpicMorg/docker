# One line per PHP minor: TestRail versions from roles/common/files/versions/testrail/<list>
# are built FROM epicmorg/apache2:php<testrail_php> with the testrail-<ver>-ion<testrail_ion>.zip package.
# testrail_cassandra: none | prebuilt (Gurock .so, PHP 7.4) | source (PHP 8 fork of the DataStax php-driver).
# TestRail >= 7.0 does not start without the Cassandra PHP extension.

# No epicmorg/apache2:php5.x image and no dirs for these versions (TestRail 3.0 - 5.4.0).
#- name: "Generate images for Testrail (PHP 5.5)"
#  import_tasks: testrail.yml
#  vars:
#    testrail_php: "5.5"
#    testrail_ion: "55"
#    testrail_cassandra: "none"
#    testrail_list: "testrail.php55.txt"

- name: "Generate images for Testrail (PHP 7.0)"
  import_tasks: testrail.yml
  vars:
    testrail_php: "7.0"
    testrail_ion: "70"
    testrail_cassandra: "none"
    testrail_list: "testrail.php70.txt"

- name: "Generate images for Testrail (PHP 7.1)"
  import_tasks: testrail.yml
  vars:
    testrail_php: "7.1"
    testrail_ion: "71"
    testrail_cassandra: "none"
    testrail_list: "testrail.php71.txt"

- name: "Generate images for Testrail (PHP 7.2)"
  import_tasks: testrail.yml
  vars:
    testrail_php: "7.2"
    testrail_ion: "72"
    testrail_cassandra: "none"
    testrail_list: "testrail.php72.txt"

# TestRail 7.x ships no ion74 package; the ion72 one runs on the PHP 7.4 loader.
- name: "Generate images for Testrail (PHP 7.4)"
  import_tasks: testrail.yml
  vars:
    testrail_php: "7.4"
    testrail_ion: "72"
    testrail_cassandra: "prebuilt"
    testrail_list: "testrail.php74.txt"

- name: "Generate images for Testrail (PHP 8.1)"
  import_tasks: testrail.yml
  vars:
    testrail_php: "8.1"
    testrail_ion: "81"
    testrail_cassandra: "source"
    testrail_list: "testrail.php81.txt"
