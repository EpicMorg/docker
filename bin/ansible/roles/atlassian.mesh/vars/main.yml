atlassian_root: "{{ playbook_dir }}/../../linux/ecosystem/apps/atlassian"
# Defaults
target_directory_mesh_1: "{{ atlassian_root }}/mesh/1"
target_directory_mesh_2: "{{ atlassian_root }}/mesh/2"
target_directory_mesh_3: "{{ atlassian_root }}/mesh/3"
target_directory_mesh_4: "{{ atlassian_root }}/mesh/4"

# git per Bitbucket Mesh major.minor(.patch): the newest git line the release accepts. Mesh refuses to
# start with an unsupported git ("git.version.unsupported-from" / "git.versions.unsupported" in the
# mesh-core jar of mesh-app.jar); pin = the newest line below unsupported-from that is not in the list.
# by_patch: from that patch on (the bound moves inside a minor). mesh-git.sh asserts it at build time.
# A minor missing here fails the generation - add it when a new Mesh minor ships.
mesh_git:
  "1.0": { pin: "2.36", by_patch: { "1.0.4": "2.37" } }
  "1.1": { pin: "2.36", by_patch: { "1.1.4": "2.37" } }
  "1.2": { pin: "2.37" }
  "1.3": { pin: "2.37" }
