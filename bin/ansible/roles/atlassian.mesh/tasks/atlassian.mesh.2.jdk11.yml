- name: Read versions from file
  slurp:
     src: "{{ playbook_dir }}/roles/common/files/versions/mesh/2.jdk11.txt"
  register: version_output

- name: Set version variable
  set_fact:
    mesh_versions: "{{ version_output['content'] | b64decode | trim | split('\n') | map('trim') | reject('equalto', '') | list }}"

- name: Create directories for Bitbucket Mesh versions
  file:
    path: "{{ target_directory_mesh_2 }}/{{ item }}"
    state: directory
    mode: '0755'
    force: true
  with_items: "{{ mesh_versions }}"

- name: Remove .env (single-JDK images carry RELEASE in the Dockerfile)
  file:
    path: "{{ target_directory_mesh_2 }}/{{ item }}/.env"
    state: absent
  with_items: "{{ mesh_versions }}"

- name: Copy docker-compose.yml from template to each version directory
  template:
    src: "docker-compose/template.docker-compose.jdk11.yml.j2"
    dest: "{{ target_directory_mesh_2 }}/{{ item }}/docker-compose.yml"
    force: true
  with_items: "{{ mesh_versions }}"

- name: Copy Dockerfile from template to each version directory
  template:
    src: "dockerfile/template.Dockerfile.jdk11.j2"
    dest: "{{ target_directory_mesh_2 }}/{{ item }}/Dockerfile"
    force: true
  with_items: "{{ mesh_versions }}"

- name: Copy entrypoint.sh from 'files' directory to each version directory
  copy:
    src: "entrypoint.sh"
    dest: "{{ target_directory_mesh_2 }}/{{ item }}/entrypoint.sh"
    mode: "0777"
    force: true
  with_items: "{{ mesh_versions }}"

- name: Copy Makefile from 'files' directory to each version directory
  copy:
    src: "Makefile"
    dest: "{{ target_directory_mesh_2 }}/{{ item }}/Makefile"
    force: true
  with_items: "{{ mesh_versions }}"

- name: Copy mesh-git.sh from 'files' directory to each version directory
  copy:
    src: "mesh-git.sh"
    dest: "{{ target_directory_mesh_2 }}/{{ item }}/mesh-git.sh"
    mode: "0755"
    force: true
  with_items: "{{ mesh_versions }}"
