- name: Read versions from file
  slurp:
     src: "{{ playbook_dir }}/roles/common/files/versions/crowd/2.jdk6-jdk7-jdk8.txt"
  register: version_output

- name: Set version variable
  set_fact:
    crowd_versions: "{{ version_output['content'] | b64decode | trim | split('\n') | map('trim') | reject('equalto', '') | list }}"

- name: Create directories for Crowd versions
  file:
    path: "{{ target_directory_crowd_2 }}/{{ item }}"
    state: directory
    mode: '0755'
    force: true
  with_items: "{{ crowd_versions }}"

- name: Remove .env (RELEASE and URLs live in the Dockerfile; .env breaks buildah-wrapper settings)
  file:
    path: "{{ target_directory_crowd_2 }}/{{ item }}/.env"
    state: absent
  with_items: "{{ crowd_versions }}"

- name: Copy docker-compose.yml from template to each version directory
  template:
    src: "docker-compose/template.docker-compose.jdk6-7-8.yml.j2"
    dest: "{{ target_directory_crowd_2 }}/{{ item }}/docker-compose.yml"
    force: true
  with_items: "{{ crowd_versions }}"

- name: Copy Dockerfile from template to each version directory
  template:
    src: "dockerfile/template.Dockerfile.jdk6.sed.j2"
    dest: "{{ target_directory_crowd_2 }}/{{ item }}/Dockerfile"
    force: true
  with_items: "{{ crowd_versions }}"

- name: Copy Dockerfile.jdk7 from template to each version directory
  template:
    src: "dockerfile/template.Dockerfile.jdk7.sed.j2"
    dest: "{{ target_directory_crowd_2 }}/{{ item }}/Dockerfile.jdk7"
    force: true
  with_items: "{{ crowd_versions }}"

- name: Copy Dockerfile.jdk8 from template to each version directory
  template:
    src: "dockerfile/template.Dockerfile.jdk8.sed.j2"
    dest: "{{ target_directory_crowd_2 }}/{{ item }}/Dockerfile.jdk8"
    force: true
  with_items: "{{ crowd_versions }}"

