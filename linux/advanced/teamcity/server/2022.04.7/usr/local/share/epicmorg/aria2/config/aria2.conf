# /usr/local/share/epicmorg/aria2/config/aria2.conf
# Download options
max-connection-per-server=8
split=8
min-split-size=10M

# Timeouts and retries (aggressive, fail-fast for CI)
connect-timeout=15
timeout=15
retry-wait=5
max-tries=5

# Logging and interface
console-log-level=notice
log-level=warn
summary-interval=10
download-result=default

# Security (if needed to ignore self-signed certificates in the lab)
check-certificate=false

# Miscellaneous
continue=true
allow-overwrite=true