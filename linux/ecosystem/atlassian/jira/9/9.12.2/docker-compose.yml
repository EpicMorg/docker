      - quay.io/epicmorg/jira:9.12.2
  app-jdk8:
    image: "epicmorg/jira:9.12.2-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/jira:9.12.2-jdk8
  app-jdk11:
    image: "epicmorg/jira:9.12.2-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/jira:9.12.2-jdk11
  app-jdk17:
    image: "epicmorg/jira:9.12.2-jdk17"
    build:
      context: .
      dockerfile: Dockerfile.jdk17
    x-mirrors:
      - quay.io/epicmorg/jira:9.12.2-jdk17