services:
  app:
    image: "epicmorg/bitbucket:7.0.5"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/bitbucket:7.0.5
  app-jdk8:
    image: "epicmorg/bitbucket:7.0.5-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/bitbucket:7.0.5-jdk8
  app-jdk11:
    image: "epicmorg/bitbucket:7.0.5-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/bitbucket:7.0.5-jdk11
