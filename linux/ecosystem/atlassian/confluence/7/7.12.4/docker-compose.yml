services:
  app:
    image: "epicmorg/confluence:7.12.4"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.12.4
  app-jdk8:
    image: "epicmorg/confluence:7.12.4-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.12.4-jdk8
  app-jdk11:
    image: "epicmorg/confluence:7.12.4-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/confluence:7.12.4-jdk11
