; Swarm programs on top of the parent image's apache2 + php-fpm (apache2.conf,
; php-fpm.conf next to this file). Same set as Perforce's own image.

; Swarm workers: /etc/cron.d/helix-swarm runs p4-bin/scripts/swarm-cron.sh
; as swarm-cron every minute, which hits the hosts in swarm-cron-hosts.conf.
[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; WebSocket gateway (bundled node). The wrapper exits 0 when
; notifications.websocket.enabled is false in data/config.php (opt-in), so
; autorestart=unexpected leaves it EXITED instead of looping. startsecs=0: that
; quick exit must not count as a failed start - FATAL would make the parent's
; quit_on_failure listener stop the container.
[program:swarm-websocket]
command=/opt/perforce/swarm/sbin/start-websocket.sh
autostart=true
autorestart=unexpected
startsecs=0
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=NODE_ENV="production",WS_PORT="8080",HEALTH_PORT="9000",ALLOWED_ORIGINS="%(ENV_SWARM_WS_ALLOWED_ORIGINS)s"
