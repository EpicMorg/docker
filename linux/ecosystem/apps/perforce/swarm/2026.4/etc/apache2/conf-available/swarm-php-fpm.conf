##
# Helix Swarm behind php-fpm (no mod_php), server-wide so that any vhost -
# the image's perforce-swarm-site.conf or a bind-mounted one - gets it.
#
# CGIPassAuth: Apache hands the Authorization header to FastCGI only when told
# to; Swarm's API reads HTTP basic auth (user + ticket) from it.
##
<Directory "/opt/perforce/swarm/public">
    CGIPassAuth On
</Directory>
