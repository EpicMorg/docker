[program:testrail-task]
command=/usr/local/bin/testrail-task.sh
user=www-data
autostart=true
autorestart=true
startretries=3
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
