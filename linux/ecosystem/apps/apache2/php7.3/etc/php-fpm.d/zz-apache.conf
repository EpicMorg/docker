;;;;;;;;;;;;;;;;;;;;;
; www pool override ;
;;;;;;;;;;;;;;;;;;;;;
;
; Apache runs in THIS container, so the www pool always listens on a unix
; socket, whatever the base php image defaults to (7.0-8.0 use TCP 9000).
; Loaded after www.conf (alphabetical include order), so these keys win.
;
; Apache reaches it via conf-enabled/php-fpm.conf
; (SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost").

[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
