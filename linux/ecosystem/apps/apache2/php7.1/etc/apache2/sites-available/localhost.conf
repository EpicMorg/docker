##
# Default site. PHP is handled server-wide by conf-enabled/php-fpm.conf.
#
# Downstream images: `a2dissite localhost` and `a2ensite <your-site>`.
##
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
