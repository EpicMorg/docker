##
# PHP through php-fpm on a unix socket (mod_proxy_fcgi). No mod_php.
#
# Server-wide on purpose: every vhost (the default `localhost` site or your
# own one in sites-enabled/) gets PHP without repeating the handler.
# The www pool is forced onto this socket by php-fpm.d/zz-apache.conf.
##
DirectoryIndex index.php index.html index.htm

<FilesMatch "\.(php|phtml)$">
    SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
</FilesMatch>

<FilesMatch "^\.user\.ini">
    Require all denied
</FilesMatch>

# php-fpm ping / status (ping.path / pm.status_path of the www pool).
# Local only: used by the container HEALTHCHECK, which thereby checks
# Apache and php-fpm with one request.
<LocationMatch "^/php-fpm-(ping|status)$">
    Require local
    SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
</LocationMatch>
