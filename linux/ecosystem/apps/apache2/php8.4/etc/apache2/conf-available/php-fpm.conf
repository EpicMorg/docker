# Global PHP-FPM handler via UNIX socket
<IfModule mod_proxy_fcgi.module>
    # Добавляем index.php в глобальный список индексов
    DirectoryIndex index.php index.html

    <FilesMatch "^\.ph(p[34578]?|t|tml|ps)$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <FilesMatch "^\.user\.ini">
        Require all denied
    </FilesMatch>
</IfModule>