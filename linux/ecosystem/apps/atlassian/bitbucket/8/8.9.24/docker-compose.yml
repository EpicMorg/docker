    x-mirrors:
      - docker.io/epicmorg/bitbucket:8.9.24-jdk11
      - quay.io/epicmorg/bitbucket:8.9.24-jdk11
      - ghcr.io/epicmorg/bitbucket:8.9.24-jdk11
  app-jdk17:
    image: "epicmorg/bitbucket:8.9.24-jdk17"
