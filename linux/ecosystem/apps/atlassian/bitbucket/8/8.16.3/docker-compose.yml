services:
  app:
    image: "epicmorg/bitbucket:8.16.3"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/bitbucket:8.16.3
  app-jdk8:
    image: "epicmorg/bitbucket:8.16.3-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/bitbucket:8.16.3-jdk8
  app-jdk11:
    image: "epicmorg/bitbucket:8.16.3-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/bitbucket:8.16.3-jdk11
  app-jdk17:
    image: "epicmorg/bitbucket:8.16.3-jdk17"
    build:
      context: .
      dockerfile: Dockerfile.jdk17
    x-mirrors:
      - quay.io/epicmorg/bitbucket:8.16.3-jdk17
