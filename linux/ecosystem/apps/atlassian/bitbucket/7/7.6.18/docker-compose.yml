services:
  app:
    image: "epicmorg/bitbucket:7.6.18"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:7.6.18
      - quay.io/epicmorg/bitbucket:7.6.18
      - ghcr.io/epicmorg/bitbucket:7.6.18
  app-jdk8:
