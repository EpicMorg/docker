services:
  app:
    image: "epicmorg/bitbucket:7.6.21"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:7.6.21
      - quay.io/epicmorg/bitbucket:7.6.21
      - ghcr.io/epicmorg/bitbucket:7.6.21
  app-jdk8:
