services:
  app:
    image: "epicmorg/bitbucket:6.1.9"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.1.9
      - quay.io/epicmorg/bitbucket:6.1.9
      - ghcr.io/epicmorg/bitbucket:6.1.9
  app-jdk8:
    image: "epicmorg/bitbucket:6.1.9-jdk8"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.1.9-jdk8
      - quay.io/epicmorg/bitbucket:6.1.9-jdk8
      - ghcr.io/epicmorg/bitbucket:6.1.9-jdk8
  app-jdk11:
    image: "epicmorg/bitbucket:6.1.9-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.1.9-jdk11
      - quay.io/epicmorg/bitbucket:6.1.9-jdk11
      - ghcr.io/epicmorg/bitbucket:6.1.9-jdk11
