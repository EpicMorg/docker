services:
  app:
    image: "epicmorg/bitbucket:6.10.11"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.10.11
      - quay.io/epicmorg/bitbucket:6.10.11
      - ghcr.io/epicmorg/bitbucket:6.10.11
  app-jdk8:
    image: "epicmorg/bitbucket:6.10.11-jdk8"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.10.11-jdk8
      - quay.io/epicmorg/bitbucket:6.10.11-jdk8
      - ghcr.io/epicmorg/bitbucket:6.10.11-jdk8
  app-jdk11:
    image: "epicmorg/bitbucket:6.10.11-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/bitbucket:6.10.11-jdk11
      - quay.io/epicmorg/bitbucket:6.10.11-jdk11
      - ghcr.io/epicmorg/bitbucket:6.10.11-jdk11
