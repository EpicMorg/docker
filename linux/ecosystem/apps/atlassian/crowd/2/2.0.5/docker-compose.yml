      - quay.io/epicmorg/crowd:2.0.5-jdk6
      - ghcr.io/epicmorg/crowd:2.0.5-jdk6
  app-jdk7:
    image: "epicmorg/crowd:2.0.5-jdk7"
    build:
      context: .
      dockerfile: Dockerfile.jdk7
    x-mirrors:
      - docker.io/epicmorg/crowd:2.0.5-jdk7
      - quay.io/epicmorg/crowd:2.0.5-jdk7
      - ghcr.io/epicmorg/crowd:2.0.5-jdk7
