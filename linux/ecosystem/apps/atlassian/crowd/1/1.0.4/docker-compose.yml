services:
  app:
    image: "epicmorg/crowd:1.0.4"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/crowd:1.0.4
      - quay.io/epicmorg/crowd:1.0.4
      - ghcr.io/epicmorg/crowd:1.0.4
  app-jdk6:
