services:
  app:
    image: "epicmorg/crowd:5.1.12"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/crowd:5.1.12
      - quay.io/epicmorg/crowd:5.1.12
      - ghcr.io/epicmorg/crowd:5.1.12
  app-jdk8:
    image: "epicmorg/crowd:5.1.12-jdk8"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/crowd:5.1.12-jdk8
      - quay.io/epicmorg/crowd:5.1.12-jdk8
      - ghcr.io/epicmorg/crowd:5.1.12-jdk8
  app-jdk11:
    image: "epicmorg/crowd:5.1.12-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/crowd:5.1.12-jdk11
      - quay.io/epicmorg/crowd:5.1.12-jdk11
      - ghcr.io/epicmorg/crowd:5.1.12-jdk11
