services:
  app:
    image: "epicmorg/jira:8.5.16"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/jira:8.5.16
      - quay.io/epicmorg/jira:8.5.16
      - ghcr.io/epicmorg/jira:8.5.16
  app-jdk8:
