      context: .
    x-mirrors:
      - docker.io/epicmorg/jira:8.5.16-jdk8
      - quay.io/epicmorg/jira:8.5.16-jdk8
      - ghcr.io/epicmorg/jira:8.5.16-jdk8
  app-jdk11:
    image: "epicmorg/jira:8.5.16-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/jira:8.5.16-jdk11
      - quay.io/epicmorg/jira:8.5.16-jdk11
      - ghcr.io/epicmorg/jira:8.5.16-jdk11
