      - quay.io/epicmorg/jira:8.5.9-jdk8
      - ghcr.io/epicmorg/jira:8.5.9-jdk8
  app-jdk11:
    image: "epicmorg/jira:8.5.9-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/jira:8.5.9-jdk11
      - quay.io/epicmorg/jira:8.5.9-jdk11
