    image: "epicmorg/jira:6.4-jdk7"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/jira:6.4-jdk7
      - quay.io/epicmorg/jira:6.4-jdk7
      - ghcr.io/epicmorg/jira:6.4-jdk7
  app-jdk8:
    image: "epicmorg/jira:6.4-jdk8"
    build:
      context: .
      dockerfile: Dockerfile.jdk8
    x-mirrors:
      - docker.io/epicmorg/jira:6.4-jdk8
      - quay.io/epicmorg/jira:6.4-jdk8
      - ghcr.io/epicmorg/jira:6.4-jdk8
