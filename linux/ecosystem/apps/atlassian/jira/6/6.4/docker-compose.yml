services:
  app:
    image: "epicmorg/jira:6.4"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/jira:6.4
      - quay.io/epicmorg/jira:6.4
      - ghcr.io/epicmorg/jira:6.4
