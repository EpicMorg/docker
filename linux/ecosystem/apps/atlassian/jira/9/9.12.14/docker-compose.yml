      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/jira:9.12.14-jdk11
  app-jdk17:
    image: "epicmorg/jira:9.12.14-jdk17"
    build:
      context: .
      dockerfile: Dockerfile.jdk17
    x-mirrors:
      - quay.io/epicmorg/jira:9.12.14-jdk17