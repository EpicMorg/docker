    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/jira:9.14.0-jdk11
      - quay.io/epicmorg/jira:9.14.0-jdk11
      - ghcr.io/epicmorg/jira:9.14.0-jdk11
  app-jdk17:
    image: "epicmorg/jira:9.14.0-jdk17"
    build:
      context: .
