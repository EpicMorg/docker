services:
  app:
    image: "epicmorg/jira:9.14.0"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/jira:9.14.0
      - quay.io/epicmorg/jira:9.14.0
      - ghcr.io/epicmorg/jira:9.14.0
