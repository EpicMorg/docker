services:
  app:
    image: "epicmorg/bitbucket-mesh:3.6.0"
    build:
      context: .
    x-squash: false
    x-mirrors:
      - docker.io/epicmorg/bitbucket-mesh:3.6.0
      - quay.io/epicmorg/bitbucket-mesh:3.6.0
      - ghcr.io/epicmorg/bitbucket-mesh:3.6.0
  app-jdk17:
    image: "epicmorg/bitbucket-mesh:3.6.0-jdk17"
    build:
      context: .
    x-squash: false
    x-mirrors:
      - docker.io/epicmorg/bitbucket-mesh:3.6.0-jdk17
      - quay.io/epicmorg/bitbucket-mesh:3.6.0-jdk17
      - ghcr.io/epicmorg/bitbucket-mesh:3.6.0-jdk17
  app-jdk21:
    image: "epicmorg/bitbucket-mesh:3.6.0-jdk21"
    build:
      context: .
      dockerfile: Dockerfile.jdk21
    x-squash: false
    x-mirrors:
      - docker.io/epicmorg/bitbucket-mesh:3.6.0-jdk21
      - quay.io/epicmorg/bitbucket-mesh:3.6.0-jdk21
      - ghcr.io/epicmorg/bitbucket-mesh:3.6.0-jdk21
