services:
  app:
    image: "epicmorg/bitbucket-mesh:2.5.10"
    build:
      context: .
    x-squash: false
    x-mirrors:
      - docker.io/epicmorg/bitbucket-mesh:2.5.10
      - quay.io/epicmorg/bitbucket-mesh:2.5.10
      - ghcr.io/epicmorg/bitbucket-mesh:2.5.10
