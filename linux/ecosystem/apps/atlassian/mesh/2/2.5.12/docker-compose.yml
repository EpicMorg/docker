services:
  app:
    image: "epicmorg/bitbucket-mesh:2.5.12"
    build:
      context: .
    x-squash: false
    x-mirrors:
      - docker.io/epicmorg/bitbucket-mesh:2.5.12
      - quay.io/epicmorg/bitbucket-mesh:2.5.12
      - ghcr.io/epicmorg/bitbucket-mesh:2.5.12
