services:
  app:
    image: "epicmorg/confluence:9.0.1"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:9.0.1
      - quay.io/epicmorg/confluence:9.0.1
      - ghcr.io/epicmorg/confluence:9.0.1
  app-jdk17:
    image: "epicmorg/confluence:9.0.1-jdk17"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:9.0.1-jdk17
      - quay.io/epicmorg/confluence:9.0.1-jdk17
      - ghcr.io/epicmorg/confluence:9.0.1-jdk17
  app-jdk21:
    image: "epicmorg/confluence:9.0.1-jdk21"
    build:
      context: .
      dockerfile: Dockerfile.jdk21
    x-mirrors:
      - docker.io/epicmorg/confluence:9.0.1-jdk21
      - quay.io/epicmorg/confluence:9.0.1-jdk21
      - ghcr.io/epicmorg/confluence:9.0.1-jdk21
