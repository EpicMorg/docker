services:
  app:
    image: "epicmorg/confluence:9.2.13"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:9.2.13
      - quay.io/epicmorg/confluence:9.2.13
      - ghcr.io/epicmorg/confluence:9.2.13
  app-jdk17:
    image: "epicmorg/confluence:9.2.13-jdk17"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:9.2.13-jdk17
      - quay.io/epicmorg/confluence:9.2.13-jdk17
      - ghcr.io/epicmorg/confluence:9.2.13-jdk17
  app-jdk21:
    image: "epicmorg/confluence:9.2.13-jdk21"
    build:
      context: .
      dockerfile: Dockerfile.jdk21
    x-mirrors:
      - docker.io/epicmorg/confluence:9.2.13-jdk21
      - quay.io/epicmorg/confluence:9.2.13-jdk21
      - ghcr.io/epicmorg/confluence:9.2.13-jdk21
