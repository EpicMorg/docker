services:
  app:
    image: "epicmorg/confluence:8.5.24"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:8.5.24
      - quay.io/epicmorg/confluence:8.5.24
      - ghcr.io/epicmorg/confluence:8.5.24
  app-jdk11:
    image: "epicmorg/confluence:8.5.24-jdk11"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:8.5.24-jdk11
      - quay.io/epicmorg/confluence:8.5.24-jdk11
      - ghcr.io/epicmorg/confluence:8.5.24-jdk11
  app-jdk17:
    image: "epicmorg/confluence:8.5.24-jdk17"
    build:
      context: .
      dockerfile: Dockerfile.jdk17
    x-mirrors:
      - docker.io/epicmorg/confluence:8.5.24-jdk17
      - quay.io/epicmorg/confluence:8.5.24-jdk17
      - ghcr.io/epicmorg/confluence:8.5.24-jdk17
