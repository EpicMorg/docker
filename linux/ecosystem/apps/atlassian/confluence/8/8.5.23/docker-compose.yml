  app-jdk17:
    image: "epicmorg/confluence:8.5.23-jdk17"
    build:
      context: .
      dockerfile: Dockerfile.jdk17
    x-mirrors:
      - quay.io/epicmorg/confluence:8.5.23-jdk17
