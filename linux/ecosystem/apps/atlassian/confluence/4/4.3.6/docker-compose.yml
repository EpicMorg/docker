services:
  app:
    image: "epicmorg/confluence:4.3.6"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:4.3.6
  app-jdk6:
    image: "epicmorg/confluence:4.3.6-jdk6"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:4.3.6-jdk6
  app-jdk7:
    image: "epicmorg/confluence:4.3.6-jdk7"
    build:
      context: .
      dockerfile: Dockerfile.jdk7
    x-mirrors:
      - quay.io/epicmorg/confluence:4.3.6-jdk7
