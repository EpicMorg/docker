services:
  app:
    image: "epicmorg/confluence:5.8.15"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.8.15
      - quay.io/epicmorg/confluence:5.8.15
      - ghcr.io/epicmorg/confluence:5.8.15
  app-jdk7:
