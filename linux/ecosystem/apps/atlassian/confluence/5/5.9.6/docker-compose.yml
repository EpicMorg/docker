services:
  app:
    image: "epicmorg/confluence:5.9.6"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.9.6
      - quay.io/epicmorg/confluence:5.9.6
      - ghcr.io/epicmorg/confluence:5.9.6
  app-jdk7:
