services:
  app:
    image: "epicmorg/confluence:5.9.11"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.9.11
      - quay.io/epicmorg/confluence:5.9.11
      - ghcr.io/epicmorg/confluence:5.9.11
  app-jdk7:
    image: "epicmorg/confluence:5.9.11-jdk7"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.9.11-jdk7
      - quay.io/epicmorg/confluence:5.9.11-jdk7
      - ghcr.io/epicmorg/confluence:5.9.11-jdk7
  app-jdk8:
    image: "epicmorg/confluence:5.9.11-jdk8"
    build:
      context: .
      dockerfile: Dockerfile.jdk8
    x-mirrors:
      - docker.io/epicmorg/confluence:5.9.11-jdk8
      - quay.io/epicmorg/confluence:5.9.11-jdk8
      - ghcr.io/epicmorg/confluence:5.9.11-jdk8
