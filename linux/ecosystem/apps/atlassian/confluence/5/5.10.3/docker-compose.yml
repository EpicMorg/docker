services:
  app:
    image: "epicmorg/confluence:5.10.3"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.10.3
      - quay.io/epicmorg/confluence:5.10.3
      - ghcr.io/epicmorg/confluence:5.10.3
  app-jdk7:
    image: "epicmorg/confluence:5.10.3-jdk7"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:5.10.3-jdk7
      - quay.io/epicmorg/confluence:5.10.3-jdk7
      - ghcr.io/epicmorg/confluence:5.10.3-jdk7
  app-jdk8:
    image: "epicmorg/confluence:5.10.3-jdk8"
    build:
      context: .
      dockerfile: Dockerfile.jdk8
    x-mirrors:
      - docker.io/epicmorg/confluence:5.10.3-jdk8
      - quay.io/epicmorg/confluence:5.10.3-jdk8
      - ghcr.io/epicmorg/confluence:5.10.3-jdk8
