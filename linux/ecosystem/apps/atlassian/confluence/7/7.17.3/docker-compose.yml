services:
  app:
    image: "epicmorg/confluence:7.17.3"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:7.17.3
      - quay.io/epicmorg/confluence:7.17.3
      - ghcr.io/epicmorg/confluence:7.17.3
  app-jdk8:
    image: "epicmorg/confluence:7.17.3-jdk8"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:7.17.3-jdk8
      - quay.io/epicmorg/confluence:7.17.3-jdk8
      - ghcr.io/epicmorg/confluence:7.17.3-jdk8
  app-jdk11:
    image: "epicmorg/confluence:7.17.3-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - docker.io/epicmorg/confluence:7.17.3-jdk11
      - quay.io/epicmorg/confluence:7.17.3-jdk11
      - ghcr.io/epicmorg/confluence:7.17.3-jdk11
