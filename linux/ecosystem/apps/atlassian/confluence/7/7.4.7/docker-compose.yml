services:
  app:
    image: "epicmorg/confluence:7.4.7"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.4.7
  app-jdk8:
    image: "epicmorg/confluence:7.4.7-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.4.7-jdk8
  app-jdk11:
    image: "epicmorg/confluence:7.4.7-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/confluence:7.4.7-jdk11
