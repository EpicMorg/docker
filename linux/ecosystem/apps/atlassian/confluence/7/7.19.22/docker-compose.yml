services:
  app:
    image: "epicmorg/confluence:7.19.22"
    build:
      context: .
    x-mirrors:
      - docker.io/epicmorg/confluence:7.19.22
      - quay.io/epicmorg/confluence:7.19.22
      - ghcr.io/epicmorg/confluence:7.19.22
  app-jdk8:
