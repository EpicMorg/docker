services:
  app:
    image: "epicmorg/confluence:7.1.2"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.1.2
  app-jdk8:
    image: "epicmorg/confluence:7.1.2-jdk8"
    build:
      context: .
    x-mirrors:
      - quay.io/epicmorg/confluence:7.1.2-jdk8
  app-jdk11:
    image: "epicmorg/confluence:7.1.2-jdk11"
    build:
      context: .
      dockerfile: Dockerfile.jdk11
    x-mirrors:
      - quay.io/epicmorg/confluence:7.1.2-jdk11
