##
# Nextcloud: what the official image sets in conf-enabled/docker-php.conf,
# for php-fpm instead of mod_php (the handler is conf-enabled/php-fpm.conf).
##
DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride All
    # Authorization header to PHP (WebDAV / app passwords, OCS)
    CGIPassAuth On
</Directory>

# A request is limited by PHP (max_execution_time, set_time_limit) as under
# mod_php, not by the FastCGI proxy's idle timeout (Timeout, 300 s).
ProxyTimeout 3600
