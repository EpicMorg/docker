;;;;;;;;;;;;;;;;;;;;;;;;;;;
; www pool for Nextcloud  ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; Loaded after www.conf and zz-apache.conf (alphabetical), so these keys win.
;
; clear_env = no: config/*.config.php of the official image read the
; container environment with getenv() (REDIS_HOST, OBJECTSTORE_*, SMTP_*,
; ...), as mod_php sees it.
;
; Pool size from the environment (defaults in the Dockerfile): the official
; image is mod_php under mpm_prefork, up to 150 workers.

[www]
clear_env = no
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
catch_workers_output = yes
