;;;;;;;;;;;;;;;;;;;;;
; www pool          ;
;;;;;;;;;;;;;;;;;;;;;
;
; EpicMorg container defaults for the default pool.
;
; The two directives that matter most here are pm.max_requests and
; request_terminate_timeout - see the comments on each. Everything else is
; either a container-specific necessity or a conservative default.

[www]

user = www-data
group = www-data

; TCP by default: works both when the web server runs in THIS container
; (127.0.0.1:9000) and when it runs in another one (php:9000).
;
; A unix socket is ~5-10% faster but only works same-container. To switch:
;   listen = /run/php/php-fpm.sock
;   listen.owner = www-data
;   listen.group = www-data
;   listen.mode = 0660
listen = 9000

; Only accept FastCGI from the local machine. Remove if the web server lives
; in a different container and you are NOT on a shared docker network.
;listen.allowed_clients = 127.0.0.1

; Backlog for pending connections. -1 = system default (somaxconn).
listen.backlog = 511

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Process manager
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; dynamic: scale between min and max spare servers.
;   static    - fixed pool, lowest overhead, best when you know your memory budget
;   ondemand  - spawn per request, lowest idle footprint, higher latency on cold hit
pm = dynamic

; IMPORTANT: max_children x per-worker RSS must fit in the container memory limit.
; Rule of thumb: measure real RSS of a worker under load, then
;   max_children = (container_memory * 0.8) / worker_rss
; A too-high value here is how PHP containers get OOM-killed under load.
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; How long an idle ondemand child lives (ignored when pm = dynamic|static).
pm.process_idle_timeout = 10s

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Worker recycling - the anti-leak setting
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Respawn each worker after N requests.
;
; PHP's per-request cleanup is not perfect: extensions with their own
; allocators, leaked handles from proc_open/exec, and fragmented heaps all
; accumulate across requests. Upstream default is 0 (never recycle), which
; means a slow leak turns into an OOM after a few days of uptime.
;
; 500 is a compromise: low enough to bound any leak, high enough that the
; respawn cost (a fork + opcache warmup) stays in the noise.
pm.max_requests = 500

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Timeouts - the anti-hang setting
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Hard kill for a worker stuck past this. Upstream default is 0 = never, which
; is how a single unresponsive backend (DB, upstream HTTP, NFS) eats the whole
; pool: every worker blocks on it, max_children is reached, the site is down
; while nothing is technically crashed.
;
; NOTE: this overrides max_execution_time and applies to time spent BLOCKED in
; I/O too, which max_execution_time does not count. If a legitimate job needs
; longer (imports, report generation), give it its own pool with a higher value
; rather than raising this one globally.
request_terminate_timeout = 300s

; Dump a PHP backtrace for any request slower than this. Costs nothing until
; it triggers and turns "the site is sometimes slow" into an actual stack trace.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Logging
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Access log off by default - the web server in front already logs requests,
; and duplicating them just doubles the noise in `docker logs`.
; Uncomment to debug FastCGI-level problems.
;access.log = /proc/self/fd/2
;access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Forward worker stdout/stderr (var_dump, warnings, uncaught fatals) to the
; master's error_log. Without this they vanish into a closed pipe.
catch_workers_output = yes

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Environment
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Do NOT scrub the environment. Container configuration arrives as env vars
; (docker -e / compose environment:), and with clear_env = yes (the upstream
; default) none of it reaches getenv() or $_ENV - which silently breaks
; anything reading DB credentials from the environment.
;
; Trade-off: every env var of the container becomes visible to PHP code.
; That is normal for containers, but do not put secrets in the environment of
; a container that runs untrusted PHP.
clear_env = no

; Only pass these extensions to PHP. Prevents "upload evil.jpg, request
; evil.jpg/x.php" style attacks when the web server is misconfigured.
security.limit_extensions = .php

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Status / health endpoints
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Both are only reachable if the web server in front is configured to proxy
; them. Keep them off the public vhost.
pm.status_path = /php-fpm-status
ping.path = /php-fpm-ping
ping.response = pong

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; php.ini overrides for this pool
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Errors to stderr, not to the response body.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Should stay below request_terminate_timeout so PHP gets a chance to emit a
; proper fatal error and run shutdown handlers before FPM kills the worker.
php_admin_value[max_execution_time] = 120
