;;;;;;;;;;;;;;;;;;;;;
; php-fpm.conf      ;
;;;;;;;;;;;;;;;;;;;;;
;
; EpicMorg container defaults.
; Pool configuration lives in php-fpm.d/*.conf
;
; Override anything here by mounting your own file over
;   ${EMG_LOCAL_BASE_DIR}/php/<ver>/etc/php-fpm.conf
; or by dropping an extra pool into php-fpm.d/

[global]

; PID file is pointless in a container - the master IS the process we watch.
; Leaving it unset also avoids stale-pid problems on unclean restarts.
;pid = /run/php-fpm.pid

; Log to stderr so `docker logs` actually shows something.
; A file-based log inside a container is a log nobody reads.
error_log = /proc/self/fd/2

; notice is the sane default: startup, pool events, worker recycling.
; Use `warning` if the pool chatter is too loud.
log_level = notice

; If more than N children exit with SIGSEGV/SIGBUS within the interval,
; restart the whole pool. Without this a poisoned pool degrades silently.
emergency_restart_threshold = 10
emergency_restart_interval = 1m

; How long the master waits for a child to react to a signal before SIGKILL.
process_control_timeout = 10s

; Never daemonize: the container runtime needs php-fpm in the foreground,
; otherwise the container exits immediately after start.
daemonize = no

include=/usr/local/share/epicmorg/php/PHP_VERSION_PLACEHOLDER/etc/php-fpm.d/*.conf
