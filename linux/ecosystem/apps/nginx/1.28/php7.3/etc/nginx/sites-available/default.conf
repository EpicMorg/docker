##
# Default vhost: static files + PHP 7.3 through php-fpm on a unix socket.
#
# Mount your own vhosts into /etc/nginx/sites-enabled/ (or replace this file).
##
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	# include snippets/snakeoil.conf;

	root /var/www/html;
	index index.php index.html index.htm;

	server_name _;

	location / {
		# First attempt to serve request as file, then as directory,
		# then fall back to displaying a 404.
		# For front-controller apps (Laravel, Symfony, WordPress) use:
		#   try_files $uri $uri/ /index.php?$query_string;
		try_files $uri $uri/ =404;
	}

	# pass PHP scripts to php-fpm
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php-fpm.sock;
	}

	# php-fpm status / ping (pm.status_path / ping.path in the www pool).
	# Local only: used by the container HEALTHCHECK.
	location ~ ^/(php-fpm-status|php-fpm-ping)$ {
		allow 127.0.0.1;
		allow ::1;
		deny all;
		access_log off;
		include fastcgi_params;
		fastcgi_param SCRIPT_NAME $uri;
		fastcgi_param SCRIPT_FILENAME $document_root$uri;
		fastcgi_pass unix:/run/php/php-fpm.sock;
	}

	# deny access to .htaccess / .user.ini
	location ~ /\.(ht|user\.ini) {
		deny all;
	}
}
