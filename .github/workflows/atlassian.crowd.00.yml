# Atlassian - Crowd 0: every version dir under linux/ecosystem/apps/atlassian/crowd/0, discovered at run time (dirs are generated by bin/ansible).
# Manual only.
name: Atlassian - Crowd 0

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  list:
    name: list leaves
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: |
          .github/scripts
          linux/ecosystem/apps/atlassian/crowd/0
    - id: list
      run: |
        # assignment first, so a failing discovery fails the step (echo "$(...)" would not)
        emit() { local v; v=$(python3 .github/scripts/leaves.py "${@:2}"); echo "$1=$v" | tee -a "$GITHUB_OUTPUT"; }
        emit versions flat linux/ecosystem/apps/atlassian/crowd/0 --min 1 --max 1

  versions:
    name: ${{ matrix.leaf.name }}
    needs: list
    if: needs.list.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        leaf: ${{ fromJSON(needs.list.outputs.versions) }}
    uses: ./.github/workflows/_build-leaf.yml
    secrets: inherit
    with:
      paths: ${{ matrix.leaf.paths }}
