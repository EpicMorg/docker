name: EpicMorg Atlassian Jira 06 Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  list-versions:
    name: List Atlassian Jira 06 versions
    runs-on: [ ubuntu-24.04 ]
    outputs:
      versions: ${{ steps.list.outputs.versions }}

    steps:
    - uses: actions/checkout@v7
      with:
          sparse-checkout: linux/ecosystem/apps/atlassian/jira/6

    # Version dirs are generated (bin/ansible), so the matrix is built from the tree
    # instead of being enumerated here by hand.
    - name: List version directories
      id: list
      run: |
        cd linux/ecosystem/apps/atlassian/jira/6
        versions=$(find . -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sed 's#^\./##' | sort -V | jq -R . | jq -cs .)
        echo "${versions}"
        echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  build-images:
    name: Atlassian Jira ${{ matrix.version }} Image
    runs-on: [ ubuntu-24.04 ]
    needs: list-versions
    strategy:
      matrix:
        version: ${{ fromJSON(needs.list-versions.outputs.versions) }}

    steps:
    - uses: actions/checkout@v7
      with: 
          clean:  true
          show-progress:  true
          submodules:  true
    
    - name: Log into docker registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.DOCKER_SERVER_KEY }}" | docker login -u "${{ secrets.DOCKER_SERVER_LOGIN }}" --password-stdin

    - name: Log into Quay.IO registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.QUAY_SERVER_KEY }}" | docker login -u "${{ secrets.QUAY_SERVER_LOGIN }}" --password-stdin "${{ secrets.QUAY_SERVER_URL }}"

    - name: Log into GHCR registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io

    - name: Check buildah
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: buildah --version

    - name: Test Make
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make

    - name: Install requirements.txt
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make pip

    - name: "Build and Deploy Atlassian jira ${{ matrix.version }} Image:"
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: cd linux/ecosystem/apps/atlassian/jira/6/${{ matrix.version }}    && pwd && make build && make deploy

##################################################################################

    - name: Cleanup
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make clean
