name: EpicMorg Base - Debian SID Images

on:
  workflow_dispatch:
  schedule:
    - cron:  '2 2 * * 1,3,5'

permissions:
  contents: read
  packages: write

jobs:
  build-base-images:
    name: Build Debian SID Base Images
    runs-on: [ ubuntu-24.04 ]

    steps:
    # trixie-develop (and gcc images built on it) are ~22 GB, a stock runner has ~14 GB free
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v2
      with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

    - uses: actions/checkout@v7
      with: 
          clean:  true
          show-progress:  true
          submodules:  true
    
    - name: Log into docker registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.DOCKER_SERVER_KEY }}" | docker login -u "${{ secrets.DOCKER_SERVER_LOGIN }}" --password-stdin

    - name: Log into Quay.IO registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.QUAY_SERVER_KEY }}" | docker login -u "${{ secrets.QUAY_SERVER_LOGIN }}" --password-stdin "${{ secrets.QUAY_SERVER_URL }}"

    - name: Log into GHCR registry
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io

    - name: Check buildah
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: buildah --version

    - name: Test Make
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make

    - name: Install requirements.txt
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make pip

    - name: Build and Deploy Debian SID light
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: cd linux/ecosystem/base/debian/sid/light && pwd && make build && make deploy

    - name: Build and Deploy Debian SID main
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: cd linux/ecosystem/base/debian/sid/main && pwd && make build && make deploy
      
    - name: Build and Deploy Debian SID develop
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: cd linux/ecosystem/base/debian/sid/develop && pwd && make build && make deploy

    - name: Cleanup
      uses: nick-fields/retry@v4
      with:   
          retry_wait_seconds: 45
          timeout_minutes: 600
          max_attempts: 15
          command: make clean
